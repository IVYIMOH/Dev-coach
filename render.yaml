services:
  - type: web
    name: design-coach
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false

